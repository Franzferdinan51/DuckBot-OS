# LiveKit Configuration for DuckBot v4.2
# Real-time WebRTC audio/video conferencing settings

# LiveKit Server Configuration
livekit:
  # Server settings
  host: "localhost"
  port: 7880
  websocket_url: "ws://localhost:7880"

  # API credentials (generate these with: livekit-server generate-keys)
  api_key: "${LIVEKIT_API_KEY}"
  api_secret: "${LIVEKIT_API_SECRET}"

  # Room settings
  default_room_timeout: 300  # 5 minutes
  max_participants: 50
  enable_recording: false

  # Audio settings
  audio:
    sample_rate: 48000
    channels: 2
    bitrate: 128000

  # Video settings
  video:
    resolution: "1280x720"
    framerate: 30
    bitrate: 2000000

  # Security
  enable_e2ee: true  # End-to-end encryption
  allow_anonymous: false

# VibeVoice Integration
vibevoice:
  # Bridge settings for VibeVoice + LiveKit
  enable_bridge: true
  default_voice_preset: "conversation"
  audio_format: "wav"
  sample_rate: 24000

  # Voice presets available
  presets:
    - "alice"
    - "carter"
    - "david"
    - "emily"
    - "conversation"
    - "debate"
    - "podcast"
    - "news"

# Discord Integration
discord:
  # Discord bot settings for LiveKit commands
  enable_commands: true
  command_prefix: "/"

  # Voice room settings
  default_max_participants: 25
  room_naming_pattern: "duckbot_voice_{timestamp}"

  # Commands to enable
  commands:
    - "create_voice_room"
    - "list_voice_rooms"
    - "join_voice_room"
    - "voice_room_status"

# Recording and Storage (optional)
recording:
  enabled: false
  output_dir: "./recordings"
  format: "mp4"
  max_duration: 3600  # 1 hour

# Development Settings
development:
  log_level: "INFO"
  enable_debug_mode: false
  test_room_name: "test_duckbot_room"

  # CORS settings for web interface
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://localhost:8787"

# Performance Settings
performance:
  max_concurrent_rooms: 100
  max_concurrent_users: 500
  cpu_threshold: 80
  memory_threshold: 85

  # Quality of Service
  enable_adaptive_bitrate: true
  enable_simulcast: true
  prefer_hardware_encoding: true