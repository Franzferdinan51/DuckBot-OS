version: "3.0.5"
monitoring:
  health_check_interval: 30
  performance_log_interval: 60
  restart_cooldown: 300
services:
  duckbot:
    critical: true
    dependencies: []
    health_endpoint: ''
    name: DuckBot
    port: 0
    restart_attempts: 5
    restart_delay: 30
    startup_delay: 5
    timeout: 30
  jupyter:
    critical: false
    dependencies: []
    health_endpoint: http://localhost:8889
    name: Jupyter
    port: 8889
    restart_attempts: 1
    restart_delay: 10
    startup_delay: 5
    timeout: 30
    optional: true
  n8n:
    critical: false
    dependencies: []
    health_endpoint: http://localhost:5678/healthz
    name: n8n
    port: 5678
    restart_attempts: 1
    restart_delay: 5
    startup_delay: 3
    timeout: 15
    optional: true
    skip_if_unavailable: true
  lm_studio:
    critical: false
    dependencies: []
    health_endpoint: http://localhost:1234/v1/models
    name: LM Studio
    port: 1234
    restart_attempts: 2
    restart_delay: 15
    startup_delay: 10
    timeout: 45
    optional: true
    skip_if_unavailable: true
  enhanced_duckbot:
    critical: true
    dependencies: []
    health_endpoint: http://localhost:8787/enhanced/health
    name: Enhanced DuckBot Core
    port: 8787
    restart_attempts: 5
    restart_delay: 30
    startup_delay: 10
    timeout: 45
    optional: false
    skip_if_unavailable: false
    command: python -m duckbot.enhanced_core
    description: Enhanced DuckBot with intelligent agents and provider connectors
    environment:
      ENHANCED_MODE: "true"
      INTELLIGENT_AGENTS_ENABLED: "true"
      PROVIDER_CONNECTORS_ENABLED: "true"
      CONTEXT_MANAGEMENT_ENABLED: "true"
      LEARNING_SYSTEM_ENABLED: "true"
  visual_workflow_designer:
    critical: false
    dependencies: [enhanced_duckbot]
    health_endpoint: http://localhost:8788/health
    name: Visual Workflow Designer
    port: 8788
    restart_attempts: 2
    restart_delay: 10
    startup_delay: 15
    timeout: 30
    optional: true
    skip_if_unavailable: true
    command: python -m duckbot.visual_workflow_server
    description: SIM.ai-inspired visual workflow designer with Figma-like canvas
    environment:
      WORKFLOW_DESIGNER_ENABLED: "true"
      N8N_INTEGRATION: "true"
  claude_code_router:
    critical: false
    dependencies: []
    health_endpoint: ''
    name: Claude Code Router
    port: 0
    restart_attempts: 2
    restart_delay: 5
    startup_delay: 10
    timeout: 30
    optional: true
    skip_if_unavailable: true
    command: ccr code
    description: Claude Code Router for code analysis and development tools
    environment:
      CCR_PROVIDER: openrouter
  open_webui_openrouter:
    critical: false
    dependencies: []
    health_endpoint: http://localhost:8080
    name: OpenWebUI with OpenRouter Integration
    port: 8080
    restart_attempts: 2
    restart_delay: 10
    startup_delay: 15
    timeout: 60
    optional: true
    skip_if_unavailable: true
    command: open-webui serve --port 8080 --host 0.0.0.0
    description: Modern AI chat interface with OpenRouter integration and Tailscale support
    environment:
      WEBUI_NAME: DuckBot AI - Enhanced Chat Interface
      ENABLE_COMMUNITY_SHARING: "false"
      WEBUI_AUTH: "false"
      OPENWEBUI_DATA_DIR: ./openwebui_data
  enhanced_n8n:
    critical: false
    dependencies: [enhanced_duckbot]
    health_endpoint: http://localhost:5678/healthz
    name: Enhanced n8n with AI Agents
    port: 5678
    restart_attempts: 2
    restart_delay: 10
    startup_delay: 20
    timeout: 30
    optional: true
    skip_if_unavailable: true
    command: n8n start --host 0.0.0.0 --port 5678
    description: n8n workflow automation enhanced with intelligent agents
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://0.0.0.0:5678"
      ENHANCED_NODES_ENABLED: "true"
      AI_AGENT_INTEGRATION: "true"
