name: DuckBot v4.2 Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run comprehensive tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install pytest pytest-asyncio pytest-cov black flake8 mypy bandit safety

      - name: Run code formatting check
        run: |
          black --check duckbot/ tests/

      - name: Run linting
        run: |
          flake8 duckbot/ tests/ --max-line-length=100 --exclude=__pycache__

      - name: Run type checking
        run: |
          mypy duckbot/ --ignore-missing-imports

      - name: Run security scanning
        run: |
          bandit -r duckbot/ -f json -o bandit-report.json
          safety check --json --output safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-mock

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --cov=duckbot --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unit-tests
          name: codecov-umbrella

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-reports-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      # Mock services for integration testing
      mock-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mock-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiohttp psutil

      - name: Set up test environment
        run: |
          cp .env.example .env
          echo "TEST_MODE=true" >> .env
          echo "INTEGRATION_TESTS=true" >> .env

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=duckbot --cov-report=xml --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            test-results/
            coverage.xml

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'performance')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install pytest pytest-asyncio pytest-benchmark locust psutil

      - name: Run performance benchmarks
        run: |
          pytest tests/performance/ -v --benchmark-only

      - name: Run load testing with Locust
        run: |
          locust -f tests/locustfile.py --headless -u 100 -r 10 -t 5m --csv=load-test-results

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: |
            load-test-results_*
            benchmark-results.json

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'security')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety truffleHog pip-audit semgrep

      - name: Run vulnerability scanning
        run: |
          bandit -r duckbot/ -f json -o bandit-report.json
          safety check --json --output safety-report.json
          pip-audit

      - name: Run secret scanning
        run: |
          trufflehog filesystem --exclude ".git" --json --output trufflehog-results.json

      - name: Run SAST analysis
        run: |
          semgrep --config=auto --json --output=semgrep-results.json duckbot/

      - name: Generate security report
        run: |
          python tests/security/generate_security_report.py

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: |
            bandit-report.json
            safety-report.json
            trufflehog-results.json
            semgrep-results.json
            security-report.html

  # System Tests (Docker-based)
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'system-test')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t duckbot-test:latest .

      - name: Run system tests in Docker
        run: |
          docker run --rm -v $(pwd):/app duckbot-test:latest pytest tests/system/ -v

      - name: Run end-to-end tests
        run: |
          docker-compose -f tests/docker-compose.test.yml up --abort-on-container-exit

      - name: Upload system test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: system-test-results
          path: test-results/

  # Build and Test WebUI
  webui-tests:
    name: WebUI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd duckbot/react-webui
          npm ci

      - name: Run linting
        run: |
          cd duckbot/react-webui
          npm run lint

      - name: Run type checking
        run: |
          cd duckbot/react-webui
          npm run type-check

      - name: Run unit tests
        run: |
          cd duckbot/react-webui
          npm test -- --coverage --watchAll=false

      - name: Build application
        run: |
          cd duckbot/react-webui
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: webui-build
          path: duckbot/react-webui/build/

  # Documentation Tests
  documentation-tests:
    name: Documentation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin

      - name: Build documentation
        run: |
          mkdocs build --strict

      - name: Check documentation links
        run: |
          pip install linkchecker
          linkchecker site/index.html --ignore-url=/api/

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: documentation-site
          path: site/

  # Test Results Summary
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [
      code-quality,
      unit-tests,
      integration-tests,
      performance-tests,
      security-tests,
      system-tests,
      webui-tests,
      documentation-tests
    ]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate test summary report
        run: |
          python tests/generate_test_summary.py

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })

      - name: Upload test summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: |
            test-summary.md
            test-summary.html

  # Deploy to Staging (on successful tests)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: github.ref == 'refs/heads/develop' && needs.test-summary.result == 'success'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here

      - name: Run smoke tests
        run: |
          python tests/smoke_test.py

  # Deploy to Production (on successful tests)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: github.ref == 'refs/heads/main' && needs.test-summary.result == 'success'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add production deployment commands here

      - name: Run production smoke tests
        run: |
          python tests/production_smoke_test.py

  # Notify on Test Failures
  notify-failures:
    name: Notify on Failures
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: always() && needs.test-summary.result == 'failure'
    steps:
      - name: Send failure notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#alerts'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}